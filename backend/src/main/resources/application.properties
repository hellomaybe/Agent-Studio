server.address=127.0.0.1
server.port=8080
spring.application.name=agent-studio
spring.datasource.url=${STUDIO_DB_URL:jdbc:h2:file:./data/agent-studio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;WRITE_DELAY=0}
spring.datasource.username=${STUDIO_DB_USERNAME:}
spring.datasource.password=${STUDIO_DB_PASSWORD:}
spring.flyway.clean-disabled=true
studio.live-enabled=${STUDIO_LIVE_ENABLED:false}
studio.live-daily-limit=${STUDIO_LIVE_DAILY_LIMIT:5}
