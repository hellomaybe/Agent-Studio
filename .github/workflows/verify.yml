name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  agent-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -f agent-workbench/pom.xml verify
      - run: python3 agent-workbench/smoke.py
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check SQL migrations
        run: |
          python -m pip install sqlfluff==3.4.2
          sqlfluff lint backend/src/main/resources/db/migration
      - name: Check the default backend and file database
        run: |
          mvn -B -ntp -f backend/pom.xml verify
          python tests/check_persistence.py
          python tests/check_live_debug.py
      - name: Check frontend and browser workflows
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Check MySQL migration and restart
        run: |
          mvn -B -ntp -f backend/pom.xml -Pmysql verify
          python tests/check_persistence.py --mysql
